<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Loading...</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: linear-gradient(135deg, #121212, #1e1e1e);
      font-family: 'Inter', sans-serif;
      color: #fff;
      overflow: hidden;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(30, 30, 30, 0.6);
      backdrop-filter: blur(10px);
      padding: 20px 40px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.4);
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      box-sizing: border-box;
      z-index: 10;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .avatar {
      width: 60px;
      height: 60px;
      border-radius: 100%;
      background-size: cover;
      background-position: center;
      border: 2px solid #555;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }

    .info {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .info span {
      font-size: 15px;
      color: #ccc;
    }

    .info span i {
      margin-right: 6px;
      color: #6fb4ff;
      width: 18px;
      display: inline-block;
      text-align: center;
    }

    .header-right {
      font-size: 15px;
      color: #aaa;
      font-style: italic;
    }

    .center-logo {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .center-logo img {
      max-width: 28vw;
      max-height: 28vh;
      filter: drop-shadow(0 0 20px rgba(255,255,255,0.1));
    }

    .progress-container {
      position: absolute;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%);
      width: 60%;
      background: #2c2c2c;
      height: 18px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 12px rgba(0,0,0,0.3);
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #56ccf2, #2f80ed);
      transition: width 0.3s ease;
    }

    .footer {
      position: absolute;
      bottom: 20px;
      width: 100%;
      text-align: center;
      font-size: 14px;
      color: #888;
    }

    .footer a {
      color: #6fb4ff;
      text-decoration: none;
    }

    .footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-left">
      <div class="avatar" id="avatar"></div>
      <div class="info">
        <span><i class="fa-brands fa-steam"></i><span id="steamname">Steamname lädt...</span></span>
        <span><i class="fa-solid fa-user"></i><span id="rpname">RP-Name lädt...</span></span>
        <span><i class="fa-solid fa-coins"></i><span id="money">Geld lädt...</span></span>
        <span><i class="fa-regular fa-clock"></i><span id="playtime">Spielzeit lädt...</span></span>
      </div>
    </div>
    <div class="header-right">
      Lade Serverdaten...
    </div>
  </div>

  <div class="center-logo">
    <img src="logo.png" alt="Server Logo">
  </div>

  <div class="progress-container">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <div class="footer">
    Trete unserem Discord bei: <a href="https://discord.gg/hFu7WDty6U" target="_blank">discord.gg/hFu7WDty6U</a>
  </div>

  <script>
    // Avatar setzen
    window.SetAvatar = function(url) {
      document.getElementById('avatar').style.backgroundImage = `url(${url})`;
    }

    window.SetSteamName = function(name) {
      document.getElementById('steamname').textContent = name;
    }

    window.SetRPName = function(name) {
      document.getElementById('rpname').textContent = name;
    }

    window.SetMoney = function(amount) {
      document.getElementById('money').textContent = amount + " $";
    }

    window.SetPlaytime = function(time) {
      document.getElementById('playtime').textContent = time;
    }

    // Simulierter Ladebalken
    let percent = 0;
    const bar = document.getElementById("progressBar");
    const interval = setInterval(() => {
      percent += Math.random() * 6;
      if (percent >= 100) {
        percent = 100;
        clearInterval(interval);
      }
      bar.style.width = percent + "%";
    }, 250);
  </script>

</body>
</html>
